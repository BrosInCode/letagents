services:
  api:
    image: ghcr.io/brosincode/letagents:latest
    container_name: letagents-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - LETAGENTS_WEB_MODE=vue
      - LETAGENTS_RENT_ENABLED=1

  migrate:
    image: ghcr.io/brosincode/letagents:latest-migrate
    container_name: letagents-migrate
    env_file:
      - .env
    profiles:
      - migrate
