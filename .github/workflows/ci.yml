name: CI

on:
  pull_request:
    branches:
      - dev
      - staging
      - main
  push:
    branches:
      - dev
      - staging
      - main

# Prevent overlapping deploys on staging
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test dependency cooldown policy
        run: npm run test:dependency-age

      - name: Enforce dependency cooldown
        run: npm run verify:dependency-age

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify dependency signatures
        run: npm audit signatures

      - name: Audit dependency advisories
        run: npm audit --audit-level=low

      - name: Run verified dependency lifecycle scripts
        run: npm rebuild

      - name: Type check (server)
        run: npx tsc --noEmit

      - name: Test MCP helpers
        run: npm run test:mcp

      - name: Install Vue dependencies without lifecycle scripts
        run: cd src/web && npm ci --ignore-scripts

      - name: Verify Vue dependency signatures
        run: cd src/web && npm audit signatures

      - name: Audit Vue dependency advisories
        run: cd src/web && npm audit --audit-level=low

      - name: Run verified Vue dependency lifecycle scripts
        run: cd src/web && npm rebuild

      - name: Type check (Vue)
        run: cd src/web && npx vue-tsc --noEmit

      - name: Test Vue helpers
        run: npm run test:web

      - name: Build Vue app
        run: npm run build:web

      - name: Install desktop dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --prefix apps/desktop

      - name: Verify desktop dependency signatures
        run: npm audit signatures --prefix apps/desktop

      - name: Audit desktop dependency advisories
        run: npm audit --audit-level=low --prefix apps/desktop

      - name: Run verified desktop dependency lifecycle scripts
        run: npm rebuild --prefix apps/desktop

      - name: Install verified Electron runtime
        run: npm exec --prefix apps/desktop -- install-electron

      - name: Type check desktop
        run: npm --prefix apps/desktop run typecheck

      - name: Lint desktop Vue components
        run: npm --prefix apps/desktop run lint:vue-components

      - name: Test desktop
        # Pin the API base URL to an unroutable local address so the desktop
        # runtime tests (which seed fixture sessions and fire a background
        # heartbeat/pause timer) can never reach the production API. Nothing
        # listens on port 9, so a stray call fails fast instead of hitting prod.
        env:
          LETAGENTS_API_URL: http://127.0.0.1:9
        run: npm --prefix apps/desktop test

      - name: Build desktop
        run: npm --prefix apps/desktop run build

  # ── DB-backed integration tests ──
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: letagents_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d letagents_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_URL: postgres://test:test@localhost:5432/letagents_test
      GITHUB_WEBHOOK_SECRET: test-webhook-secret
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enforce dependency cooldown
        run: npm run verify:dependency-age

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify dependency signatures
        run: npm audit signatures

      - name: Audit dependency advisories
        run: npm audit --audit-level=low

      - name: Run verified dependency lifecycle scripts
        run: npm rebuild

      - name: Run message attachment tests
        run: >-
          node
          --import ./node_modules/tsx/dist/loader.mjs
          --test
          src/api/__tests__/message-attachments.test.ts
          src/api/__tests__/message-attachments-db.test.ts

      - name: Run thread inbox parity tests
        run: >-
          node
          --import ./node_modules/tsx/dist/loader.mjs
          --test
          src/api/__tests__/thread-inbox-parity-db.test.ts

      - name: Run webhook integration tests
        run: >-
          node
          --import ./node_modules/tsx/dist/loader.mjs
          --test
          src/api/__tests__/github-webhook-integration.test.ts

      - name: Run repo room access integration tests
        timeout-minutes: 5
        run: >-
          node
          --import ./node_modules/tsx/dist/loader.mjs
          --test
          src/api/__tests__/repo-room-access-integration.test.ts

      - name: Run repo migration tests
        run: >-
          node
          --import ./node_modules/tsx/dist/loader.mjs
          --test
          src/api/__tests__/github-repo-migration.test.ts

      - name: Run workflow lookup tests
        run: >-
          node
          --import ./node_modules/tsx/dist/loader.mjs
          --test
          src/api/__tests__/repo-workflow-lookup.test.ts

      - name: Run coordination DB tests
        run: >-
          node
          --import ./node_modules/tsx/dist/loader.mjs
          --test
          src/api/__tests__/coordination-db.test.ts

      - name: Run liveness announcement tests
        run: >-
          node
          --import ./node_modules/tsx/dist/loader.mjs
          --test
          src/api/__tests__/liveness-sweep.test.ts
          src/api/__tests__/liveness-announcements-db.test.ts

      - name: Run board manager failover tests
        run: >-
          node
          --import ./node_modules/tsx/dist/loader.mjs
          --test
          src/api/__tests__/board-manager-failover-sweep.test.ts
          src/api/__tests__/board-manager-failover-db.test.ts

      - name: Run board intent escalation tests
        run: >-
          node
          --import ./node_modules/tsx/dist/loader.mjs
          --test
          src/api/__tests__/board-intent-escalation-sweep.test.ts
          src/api/__tests__/board-intent-escalation-db.test.ts

      - name: Run room stall watchdog tests
        run: >-
          node
          --import ./node_modules/tsx/dist/loader.mjs
          --test
          src/api/__tests__/room-stall-sweep.test.ts
          src/api/__tests__/room-stall-db.test.ts

      - name: Run worker session auth tests
        run: >-
          node
          --import ./node_modules/tsx/dist/loader.mjs
          --test
          src/api/__tests__/worker-session-auth-integration.test.ts

      - name: Run worker bearer auth tests
        run: >-
          node
          --import ./node_modules/tsx/dist/loader.mjs
          --test
          src/api/__tests__/agent-session-bearer-integration.test.ts

      - name: Run supervisor host grant tests
        run: >-
          node
          --import ./node_modules/tsx/dist/loader.mjs
          --test
          src/api/__tests__/supervisor-host-grant-integration.test.ts

      - name: Run focus room tests
        timeout-minutes: 5
        run: >-
          node
          --import ./node_modules/tsx/dist/loader.mjs
          --test
          src/api/__tests__/focus-rooms.test.ts

      - name: Run focus lineage repair tests
        run: >-
          node
          --import ./node_modules/tsx/dist/loader.mjs
          --test
          src/api/__tests__/focus-lineage-repair.test.ts

  # ── Publish the letagents package to npm when the version bumps ──
  # No-op unless package.json holds a version that npm doesn't have yet, so a
  # release is just a version-bump commit landing on staging. Auth: either the
  # NPM_TOKEN repo secret, or npm Trusted Publishing (OIDC via id-token) once
  # this workflow is registered as a trusted publisher for the package.
  npm-publish:
    needs: [build, integration-tests]
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Trusted Publishing needs npm >= 11.5; node 22 bundles npm 10.
      - name: Update npm for Trusted Publishing support
        run: npm install -g npm@latest

      - name: Check whether this version is already published
        id: version
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          echo "local=${LOCAL_VERSION}" >> "$GITHUB_OUTPUT"
          if npm view "letagents@${LOCAL_VERSION}" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "letagents@${LOCAL_VERSION} already on npm — skipping publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "letagents@${LOCAL_VERSION} not on npm — will publish."
          fi

      - name: Install dependencies without lifecycle scripts
        if: steps.version.outputs.publish == 'true'
        run: npm ci --ignore-scripts

      - name: Verify dependency signatures
        if: steps.version.outputs.publish == 'true'
        run: npm audit signatures

      - name: Audit dependency advisories
        if: steps.version.outputs.publish == 'true'
        run: npm audit --audit-level=low

      - name: Run verified dependency lifecycle scripts
        if: steps.version.outputs.publish == 'true'
        run: npm rebuild

      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN}" ]; then
            echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" > ~/.npmrc
          fi
          npm publish

  # ── Build and push Docker images to GHCR ──
  docker:
    needs: [build, integration-tests]
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "sha_tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push the production app image
      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ""
          push: true
          tags: |
            ghcr.io/brosincode/letagents:latest
            ghcr.io/brosincode/letagents:${{ steps.vars.outputs.sha_tag }}

      # Build and push the migration image (includes drizzle-kit)
      - name: Build and push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: |
            ghcr.io/brosincode/letagents:latest-migrate
            ghcr.io/brosincode/letagents:${{ steps.vars.outputs.sha_tag }}-migrate

  # ── Deploy to production server ──
  deploy:
    needs: docker
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            IMAGE_TAG="${{ needs.docker.outputs.image_tag }}"

            cd "${{ secrets.DEPLOY_PATH }}"

            # Keep enough room before Git and Docker writes on the deploy host.
            df -h || true
            docker system df || true
            docker container prune -f || true
            docker image prune -af || true
            docker builder prune -af || true
            docker system df || true
            df -h || true

            # Clear a stale lock left by a failed checkout on a full disk.
            rm -f .git/index.lock

            # Fetch and checkout the exact commit that triggered this deploy
            git fetch origin staging
            git checkout ${{ github.sha }}

            # Pull the exact images built by this CI run
            docker pull "ghcr.io/brosincode/letagents:${IMAGE_TAG}"
            docker pull "ghcr.io/brosincode/letagents:${IMAGE_TAG}-migrate"

            # Tag as latest locally so docker compose uses them
            docker tag "ghcr.io/brosincode/letagents:${IMAGE_TAG}" "ghcr.io/brosincode/letagents:latest"
            docker tag "ghcr.io/brosincode/letagents:${IMAGE_TAG}-migrate" "ghcr.io/brosincode/letagents:latest-migrate"

            # Run checked migrations plus targeted repair steps using the baked-in migrator
            docker compose --profile migrate run --rm migrate

            # Stop systemd service if it's still running (one-time migration)
            sudo systemctl stop letagents 2>/dev/null || true
            sudo systemctl disable letagents 2>/dev/null || true

            # Stop any existing container before starting fresh
            docker compose down 2>/dev/null || true

            # Start app with the new image
            docker compose up -d

            # Wait for container to be healthy
            sleep 5

            # Health check
            curl -f http://127.0.0.1:3001/api/health || {
              echo "Health check failed!"
              docker compose logs --tail 20
              exit 1
            }

            curl -fsS http://127.0.0.1:3001/api/rental/listings >/tmp/letagents-rental-listings-smoke.json || {
              echo "Rental listings smoke failed!"
              docker compose logs --tail 20
              exit 1
            }
            if grep -q '"rent_disabled"' /tmp/letagents-rental-listings-smoke.json; then
              echo "Rental routes are still disabled after deploy!"
              docker compose logs --tail 20
              exit 1
            fi

            echo "Deploy successful (${IMAGE_TAG})"
