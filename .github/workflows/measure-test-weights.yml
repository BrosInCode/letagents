name: Measure test weights

# Measures how long each desktop daemon and electron test file takes on a
# Windows runner, one file at a time, and uploads the two weights files that
# scripts/select-test-shard.mjs balances the desktop-tests-windows shards with.
# Windows runs the git-heavy tests about five times slower than ubuntu, and not
# uniformly, so weights measured here balance the Windows shards better than
# the ubuntu measurements do.
#
# Dispatch it on a branch, download the artifact and commit its two files to
# scripts/. Nothing runs here on a push or a pull request.
on:
  workflow_dispatch:

jobs:
  measure-test-weights-windows:
    runs-on: windows-latest
    # Run alone, the daemon files take about 20 minutes of Windows time and
    # the electron files about 30.
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      # Pin the API base URL to an unroutable local address so no test can
      # reach the production API. Nothing listens on port 9.
      LETAGENTS_API_URL: http://127.0.0.1:9
    steps:
      # The same preparation as desktop-tests-windows in ci.yml: the tests
      # write under the home directory, so HOME and USERPROFILE point at a
      # scratch folder, here and in every later step. The tests read the
      # committed LF bytes, not a CRLF checkout.
      - name: Use a scratch home and keep committed line endings
        shell: bash
        run: |
          home="${RUNNER_TEMP//\\//}/home"
          mkdir -p "${home}"
          export HOME="${home}" USERPROFILE="${home}"
          git config --global core.autocrlf false
          printf 'HOME=%s\nUSERPROFILE=%s\n' "${home}" "${home}" >> "${GITHUB_ENV}"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install dependencies without lifecycle scripts
        shell: bash
        run: node scripts/retry-command.mjs npm ci --ignore-scripts --no-audit

      - name: Verify dependency signatures
        run: node scripts/retry-command.mjs npm audit signatures

      - name: Install desktop dependencies without lifecycle scripts
        shell: bash
        run: node scripts/retry-command.mjs npm ci --ignore-scripts --no-audit --prefix apps/desktop

      - name: Verify desktop dependency signatures
        run: node scripts/retry-command.mjs npm audit signatures --prefix apps/desktop

      # The gate: lifecycle scripts run only after both trees were verified,
      # and the measurement runs only when they succeeded.
      - name: Run verified dependency lifecycle scripts
        id: setup
        shell: bash
        run: |
          npm rebuild
          npm rebuild --prefix apps/desktop
          npm exec --prefix apps/desktop -- install-electron

      # Bash expands the file patterns; cmd would hand them to the script as
      # literal text. Each file runs alone, in its own process, through
      # scripts/measure-test-weights.mjs, which gives it a fresh HOME and
      # USERPROFILE; the global git config set above stays in force through
      # GIT_CONFIG_GLOBAL. A failing test file is still timed, so the step
      # fails only when a measurement itself could not run.
      - name: Measure the daemon and electron test files
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          # The native helpers the Windows daemon and electron suites use, built
          # as desktop-tests-windows builds them: every daemon pipe client opens
          # the pipe through the sealed addon, and the tests that read a process
          # birth name the process-tree helper (LETAGENTS_TEST_PROCESS_TREE_HELPER).
          node apps/desktop/native/win-daemon-pipe/build.mjs --check
          helper_dir="${RUNNER_TEMP//\\//}/process-tree"
          mkdir -p "${helper_dir}"
          node apps/desktop/native/win-process-tree/build.mjs --check
          mv apps/desktop/native/win-process-tree/build/x64/letagents-process-tree.exe "${helper_dir}/"
          export LETAGENTS_TEST_PROCESS_TREE_HELPER="${helper_dir}/letagents-process-tree.exe"
          export GIT_CONFIG_GLOBAL="${HOME}/.gitconfig"
          out_dir="${RUNNER_TEMP//\\//}/test-weights"
          mkdir -p "${out_dir}"
          cd apps/desktop
          node ../../scripts/measure-test-weights.mjs --out "${out_dir}/daemon-test-weights.json" --run "npm run test:daemon:files --" daemon/__tests__/*.test.ts
          node ../../scripts/measure-test-weights.mjs --out "${out_dir}/electron-test-weights.json" --run "npm run test:electron:files --" electron/__tests__/*.test.ts
          echo "Measured weights:"
          ls -l "${out_dir}"

      - name: Keep the measured weights
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-test-weights
          path: ${{ runner.temp }}/test-weights/*-test-weights.json
          if-no-files-found: error
          retention-days: 30
