name: Desktop release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate release ref, version, and runner architecture
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./apps/desktop/package.json').version")
          expected_tag="desktop-v${version}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Run this workflow from tag ${expected_tag}; received ${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}." >&2
            exit 1
          fi
          actual_arch=$(node -p "process.arch")
          if [[ "${actual_arch}" != "${EXPECTED_ARCH}" ]]; then
            echo "Runner architecture ${actual_arch} does not match matrix architecture ${EXPECTED_ARCH}." >&2
            exit 1
          fi
          echo "DESKTOP_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Enforce dependency cooldown
        run: npm run verify:dependency-age

      - name: Install dependencies without lifecycle scripts
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix apps/desktop

      - name: Verify dependency signatures
        run: |
          npm audit signatures
          npm audit signatures --prefix apps/desktop

      - name: Audit dependency advisories
        run: |
          npm audit --audit-level=low
          npm audit --audit-level=low --prefix apps/desktop

      - name: Run verified dependency lifecycle scripts
        run: |
          npm rebuild
          npm rebuild --prefix apps/desktop
          npm exec --prefix apps/desktop -- install-electron

      - name: Install the locked OpenCode runtime
        shell: bash
        run: |
          set -euo pipefail
          opencode_version=$(node -p "require('./apps/desktop/package.json').letagentsRuntime.openCodeVersion")
          npm install --global --prefix "${RUNNER_TEMP}/opencode" "opencode-ai@${opencode_version}"
          echo "LETAGENTS_OPENCODE_BIN=${RUNNER_TEMP}/opencode/bin/opencode" >> "${GITHUB_ENV}"

      - name: Import Developer ID certificate
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_CERTIFICATE_P12_BASE64}" || -z "${MACOS_CERTIFICATE_PASSWORD}" ]]; then
            echo "MACOS_CERTIFICATE_P12_BASE64 and MACOS_CERTIFICATE_PASSWORD secrets are required." >&2
            exit 1
          fi
          keychain_path="${RUNNER_TEMP}/letagents-signing.keychain-db"
          certificate_path="${RUNNER_TEMP}/letagents-developer-id.p12"
          keychain_password=$(openssl rand -hex 24)
          printf '%s' "${MACOS_CERTIFICATE_P12_BASE64}" | openssl base64 -d -A -out "${certificate_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" -k "${keychain_path}" -P "${MACOS_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "${keychain_password}" "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}" login.keychain-db
          echo "MACOS_RELEASE_KEYCHAIN=${keychain_path}" >> "${GITHUB_ENV}"

      - name: Prepare App Store Connect API key
        shell: bash
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_API_KEY_P8_BASE64}" || -z "${APPLE_API_KEY_ID}" ]]; then
            echo "APPLE_API_KEY_P8_BASE64 and APPLE_API_KEY_ID secrets are required." >&2
            exit 1
          fi
          api_key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "${APPLE_API_KEY_P8_BASE64}" | openssl base64 -d -A -out "${api_key_path}"
          chmod 600 "${api_key_path}"
          echo "MACOS_NOTARY_API_KEY=${api_key_path}" >> "${GITHUB_ENV}"

      - name: Prepare Developer ID provisioning profile
        shell: bash
        env:
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_PROVISIONING_PROFILE_BASE64}" ]]; then
            echo "MACOS_PROVISIONING_PROFILE_BASE64 is required for APNs entitlement signing." >&2
            exit 1
          fi
          provisioning_profile_path="${RUNNER_TEMP}/LetAgents.provisionprofile"
          printf '%s' "${MACOS_PROVISIONING_PROFILE_BASE64}" | openssl base64 -d -A -out "${provisioning_profile_path}"
          if [[ ! -s "${provisioning_profile_path}" ]]; then
            echo "The decoded macOS provisioning profile is empty." >&2
            exit 1
          fi
          chmod 600 "${provisioning_profile_path}"
          echo "MACOS_PROVISIONING_PROFILE_PATH=${provisioning_profile_path}" >> "${GITHUB_ENV}"

      - name: Build, sign, notarize, and package
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          MACOS_NOTARY_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          LETAGENTS_DESKTOP_RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/
          LETAGENTS_DESKTOP_RELEASE_NOTES: LetAgents desktop ${{ env.DESKTOP_VERSION }}
        run: npm --prefix apps/desktop run package:mac

      - name: Attest installer and update provenance
        if: ${{ github.event.repository.visibility == 'public' || vars.ENABLE_DESKTOP_PROVENANCE_ATTESTATION == 'true' }}
        uses: actions/attest@v4
        with:
          subject-path: |
            apps/desktop/release/artifacts/*.dmg
            apps/desktop/release/artifacts/*.zip

      - name: Report unavailable provenance attestation
        if: ${{ github.event.repository.visibility != 'public' && vars.ENABLE_DESKTOP_PROVENANCE_ATTESTATION != 'true' }}
        run: echo "::notice::GitHub artifact attestations are unavailable for this private repository on its current organization plan. Set ENABLE_DESKTOP_PROVENANCE_ATTESTATION=true when the plan supports private-repository attestations."

      - name: Upload release artifacts to this workflow
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-${{ matrix.arch }}
          path: apps/desktop/release/artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${MACOS_RELEASE_KEYCHAIN:-}" && -f "${MACOS_RELEASE_KEYCHAIN}" ]]; then
            security delete-keychain "${MACOS_RELEASE_KEYCHAIN}"
          fi

  publish:
    name: Publish macOS release
    needs: build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate release ref and version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./apps/desktop/package.json').version")
          expected_tag="desktop-v${version}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Run this workflow from tag ${expected_tag}; received ${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}." >&2
            exit 1
          fi
          echo "DESKTOP_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Download both architecture artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-release-*
          path: release-artifacts
          merge-multiple: true

      - name: Publish immutable versioned release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(release-artifacts/*)
          if [[ ${#artifacts[@]} -eq 0 ]]; then
            echo "No desktop release artifacts were downloaded." >&2
            exit 1
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            is_draft=$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq '.isDraft')
            if [[ "${is_draft}" == "true" ]]; then
              gh release upload "${GITHUB_REF_NAME}" "${artifacts[@]}" --clobber
              gh release edit "${GITHUB_REF_NAME}" --draft=false --prerelease --latest=false
            else
              remote_assets=$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name')
              for artifact in "${artifacts[@]}"; do
                artifact_name=$(basename "${artifact}")
                if ! grep -Fqx "${artifact_name}" <<<"${remote_assets}"; then
                  echo "Published release ${GITHUB_REF_NAME} is missing immutable asset ${artifact_name}." >&2
                  exit 1
                fi
              done
              echo "Release ${GITHUB_REF_NAME} is already published; leaving its immutable assets unchanged."
            fi
          else
            gh release create "${GITHUB_REF_NAME}" "${artifacts[@]}" \
              --draft \
              --prerelease \
              --generate-notes \
              --verify-tag \
              --latest=false \
              --title "LetAgents desktop ${DESKTOP_VERSION}"
            gh release edit "${GITHUB_REF_NAME}" --draft=false --prerelease --latest=false
          fi

      - name: Advance architecture-specific update feeds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for arch in arm64 x64; do
            source_manifest="release-artifacts/RELEASES-${arch}.json"
            if [[ ! -s "${source_manifest}" ]]; then
              echo "Missing update manifest ${source_manifest}." >&2
              exit 1
            fi
            feed_tag="desktop-feed-${arch}"
            feed_dir="${RUNNER_TEMP}/${feed_tag}"
            mkdir -p "${feed_dir}"
            cp "${source_manifest}" "${feed_dir}/RELEASES.json"
            if gh release view "${feed_tag}" >/dev/null 2>&1; then
              gh release upload "${feed_tag}" "${feed_dir}/RELEASES.json" --clobber
              gh release edit "${feed_tag}" --draft=false --prerelease --latest=false
            else
              gh release create "${feed_tag}" "${feed_dir}/RELEASES.json" \
                --target "${GITHUB_SHA}" \
                --prerelease \
                --latest=false \
                --title "LetAgents desktop ${arch} update feed" \
                --notes "Mutable Squirrel.Mac discovery manifest for the ${arch} stable channel. Versioned application artifacts remain immutable."
            fi
          done
