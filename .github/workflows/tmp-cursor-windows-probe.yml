# TEMPORARY (removed before review): runs every Cursor electron test on
# Windows with the tier-3 skip turned off, to find the tests that now pass.
name: tmp-cursor-windows-probe
on:
  push:
    branches:
      - claude/win3w2-cursor-windows
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      LETAGENTS_API_URL: http://127.0.0.1:9
    steps:
      - name: Use a scratch home and keep committed line endings
        shell: bash
        run: |
          home="${RUNNER_TEMP//\\//}/home"
          mkdir -p "${home}"
          git config --global core.autocrlf false
          printf 'HOME=%s\nUSERPROFILE=%s\n' "${home}" "${home}" >> "${GITHUB_ENV}"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install
        shell: bash
        run: |
          node scripts/retry-command.mjs npm ci --ignore-scripts --no-audit
          node scripts/retry-command.mjs npm ci --ignore-scripts --no-audit --prefix apps/desktop
          npm rebuild
          npm rebuild --prefix apps/desktop
          npm exec --prefix apps/desktop -- install-electron
      - name: Probe Cursor tests with the tier-3 skip off
        shell: bash
        run: |
          helper_dir="${RUNNER_TEMP//\\//}/process-tree"
          mkdir -p "${helper_dir}"
          node apps/desktop/native/win-process-tree/build.mjs --check
          mv apps/desktop/native/win-process-tree/build/x64/letagents-process-tree.exe "${helper_dir}/"
          export LETAGENTS_TEST_PROCESS_TREE_HELPER="${helper_dir}/letagents-process-tree.exe"
          cd apps/desktop
          sed -i 's/^export const supervisedAgentsOnly = process.platform === "win32"$/export const supervisedAgentsOnly = false \&\& process.platform === "win32"/' electron/__tests__/platform.ts
          grep -n "supervisedAgentsOnly =" electron/__tests__/platform.ts
          for file in electron/__tests__/cursor*.test.ts; do
            echo "::group::${file}"
            node --import tsx --test --test-concurrency=1 --test-timeout=300000 --experimental-test-module-mocks --test-reporter=spec "${file}" || true
            echo "::endgroup::"
            node --import tsx --test --test-concurrency=1 --test-timeout=300000 --experimental-test-module-mocks --test-reporter=tap "${file}" 2>/dev/null | grep -E "^(not )?ok [0-9]+ - " | sed "s|^|${file##*/}: |" >> "${RUNNER_TEMP}/probe-summary.txt" || true
          done
          echo "===== SUMMARY ====="
          cat "${RUNNER_TEMP}/probe-summary.txt"
