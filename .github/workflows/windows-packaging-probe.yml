# TEMPORARY: proves the Windows packaging path on a real runner while the PR
# is developed. Removed before review.
name: Windows packaging probe

on:
  push:
    branches:
      - claude/win2-packaging-e7cb97
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Keep committed line endings
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install dependencies without lifecycle scripts
        shell: bash
        run: node scripts/retry-command.mjs npm ci --ignore-scripts --no-audit

      - name: Verify dependency signatures
        run: node scripts/retry-command.mjs npm audit signatures

      - name: Install desktop dependencies without lifecycle scripts
        shell: bash
        run: node scripts/retry-command.mjs npm ci --ignore-scripts --no-audit --prefix apps/desktop

      - name: Verify desktop dependency signatures
        run: node scripts/retry-command.mjs npm audit signatures --prefix apps/desktop

      - name: Run verified dependency lifecycle scripts
        shell: bash
        run: |
          npm rebuild
          npm rebuild --prefix apps/desktop
          npm exec --prefix apps/desktop -- install-electron

      - name: Install the locked OpenCode runtime
        shell: bash
        run: |
          set -euo pipefail
          opencode_version=$(node -p "require('./apps/desktop/package.json').letagentsRuntime.openCodeVersion")
          npm install --global --prefix "${RUNNER_TEMP}/opencode" "opencode-ai@${opencode_version}"
          echo "LETAGENTS_OPENCODE_BIN=${RUNNER_TEMP}/opencode/node_modules/opencode-ai/bin/opencode.exe" >> "${GITHUB_ENV}"

      - name: Packaging unit tests
        shell: bash
        working-directory: apps/desktop
        run: node --test electron/scripts/windows-packaging.test.mjs electron/scripts/release-metadata.test.mjs

      - name: Build and package the Windows installer
        shell: bash
        run: |
          set -euo pipefail
          export LETAGENTS_DESKTOP_RELEASE_BASE_URL="https://downloads.letagents.chat/desktop/v$(node -p "require('./apps/desktop/package.json').version")/"
          npm --prefix apps/desktop run package:win

      - name: Install, smoke-check, and uninstall the installer
        shell: bash
        run: npm --prefix apps/desktop run smoke:windows-install

      - name: Diagnostic - unpackaged smoke check
        if: ${{ always() }}
        shell: bash
        working-directory: apps/desktop
        timeout-minutes: 6
        env:
          LETAGENTS_DESKTOP_SMOKE_CHECK: "1"
          LETAGENTS_DESKTOP_SMOKE_DEBUG: "1"
          ELECTRON_ENABLE_LOGGING: "1"
        run: npx electron .

      - name: Upload probe artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-probe
          path: |
            apps/desktop/release/artifacts/*.yml
            apps/desktop/release/artifacts/*.json
            apps/desktop/release/artifacts/*.sha256
            apps/desktop/release/nsis/*
            apps/desktop/release/LetAgents-win32/LetAgents/resources/app/package-artifact-manifest.json
          if-no-files-found: warn
          retention-days: 3
