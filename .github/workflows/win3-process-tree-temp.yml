# TEMPORARY (removed before review): runs the process-tree-windows steps while
# the dependency-audit gate in ci.yml is red on staging's lockfile. The
# permanent job is process-tree-windows in ci.yml.
name: win3 process tree (temporary)

on:
  push:
    branches: [claude/win3-process-lifecycle-531f28]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-tree-windows-temp:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Keep committed line endings
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Build the process-tree helper and check its seal
        id: helper
        shell: bash
        run: node apps/desktop/native/win-process-tree/build.mjs --check

      - name: Test process trees on Windows
        if: ${{ !cancelled() && steps.helper.outcome == 'success' }}
        shell: bash
        run: node --test --test-timeout=120000 apps/desktop/native/win-process-tree/seal.test.mjs apps/desktop/native/win-process-tree/process-tree.windows.test.mjs
